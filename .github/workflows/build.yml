name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: |
          mkdir proj
          unzip -q English-Lab-LEVE.zip -d proj
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: english-lab-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
