name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: |
          mkdir proj
          unzip -q English-Lab-LEVE.zip -d proj
      - name: Corrigir StudyStore
        run: |
          python3 - <<'EOF'
          p='proj/app/src/main/java/com/englishlab/trainer/StudyStore.java'
          s=open(p,encoding='utf-8').read()
          s=s.replace('new String[]{section}))while(c.moveToNext())completed.put(c.getString(0));','new String[]{section})){while(c.moveToNext())completed.put(c.getString(0));}')
          s=s.replace('String.valueOf(startAt)}))while(c.moveToNext())pending.put(c.getString(0));','String.valueOf(startAt)})){while(c.moveToNext())pending.put(c.getString(0));}')
          open(p,'w',encoding='utf-8').write(s)
          EOF
      - name: Build
        working-directory: proj
        run: gradle :app:assembleDebug --no-daemon --console=plain > ../build.log 2>&1
      - name: Mostrar erro
        if: failure()
        run: |
          if grep -q 'What went wrong' build.log; then
            grep -m1 -A25 'What went wrong' build.log > erro.txt
          else
            tail -40 build.log > erro.txt
          fi
          cat erro.txt
      - uses: actions/upload-artifact@v4
        with:
          name: english-lab-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
